# Шлюз: /api/events → сервис событий, /api/v1/other → дополнительный сервис (вариант 5, ИА332).

upstream events_upstream {
    server events:8000;
}

upstream other_upstream {
    server other:8000;
}

server {
    listen 8080;

    location /api/events {
        proxy_pass http://events_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/other {
        proxy_pass http://other_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
