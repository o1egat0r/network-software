name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GROUP: "332"
      STUDENT_ID: "s05"
      IMAGE_NAME: "devices-s05"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка синтаксиса Python
        run: python -m compileall labs services infra -q

      - name: Запуск тестов
        run: make test

      - name: Проверка docker-compose (шлюз + events + other)
        run: docker compose config -q

      - name: Сборка Docker-образа (лаба 10)
        run: docker build -t $IMAGE_NAME -f labs/week-10/Dockerfile labs/week-10

      - name: Подготовка артефактов
        run: |
          mkdir -p artifacts
          cp labs/week-10/report.md artifacts/ || true
          cp labs/week-15/analysis.md artifacts/ || true
          cp README.md artifacts/ || true

      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts
